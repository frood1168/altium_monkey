# schlib_style.toml — IC symbol style for praline.SCHLIB
#
# Font and color values derived from the 600-Power, System reference project:
#   name_font / name_font_size   -> matches [component.designator] (Consolas 10pt)
#   designator_font / size       -> matches [component.parameter]  (Consolas 8pt)
#   body_rect fill/border        -> matches [component.graphics]   (#FFFFB0 / #0000FF)
#
# [filter] controls which symbols are processed. A symbol is styled only when
# ALL active criteria pass. Omit a key to disable that criterion.
#
# [default.*] applies to all passing symbols unless a [SymbolName.*] override exists.

[filter]
# Skip 2-pin passives (R, C, L, D). Set to 1 to process everything.
min_pins = 3
# Only process symbols that have at least one body rectangle.
require_rect = true
# Skip symbols with more rectangles than this (excludes multi-rect connectors,
# resistor packs, etc. which have one rect per pin pair).
max_rects = 4
# Explicit symbol names to always skip, regardless of other criteria.
skip = [
    "SW_Push_Shielded",
    "SolderJumper_2_Bridged",
    "MountingHole_Pad",
    "TestPoint",
    "RFShield_TwoPieces",
    "PWR_FLAG",
    "GSG-RF-CONN",
]

[default.pin]
show_name = true
show_designator = true
name_font = "Consolas"
name_font_size = 10
designator_font = "Consolas"
designator_font_size = 8

[default.body_rect]
border_color = "#0000FF"
fill_color = "#FFFFB0"
line_width = "SMALL"
is_solid = true

[default.line]
color = "#0000FF"
line_width = "SMALLEST"
